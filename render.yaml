# 1. Отдельная секция для баз данных
databases:
  - name: keyed-db
    databaseName: keyed
    user: keyed_admin # Изменили с postgres на безопасное имя
    plan: free

# 2. Отдельная секция для веб-сервисов (твоего Spring Boot)
services:
  - type: web
    name: keyed-backend
    env: docker
    plan: free
    rootDir: Assets
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://keyed-db:5432/keyed
      - key: SPRING_DATASOURCE_USERNAME
        value: keyed_admin # Передаем новое имя пользователя в Spring Boot
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: keyed-db
          property: password
      - key: POSTGRES_DB
        value: keyed
      - key: POSTGRES_USER
        value: keyed_admin # Обновляем переменную для докера
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: keyed-db
          property: password
      - key: POSTGRES_PORT
        value: "5432"
      - key: JWT_SECRET
        value: KeyedVaultDevSecretChangeMeInProduction32Chars
      - key: JWT_EXPIRATION_MS
        value: "86400000"
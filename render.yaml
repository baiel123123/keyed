databases:
  - name: keyed-db
    databaseName: keyed
    user: keyed_admin
    plan: free

services:
  - type: web
    name: keyed-backend
    env: docker
    plan: free
    rootDir: Assets
    envVars:
      # ВАЖНО: Передаем сгенерированные Render данные прямо в стандартные переменные Spring
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: keyed-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        value: keyed_admin
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: keyed-db
          property: password

      # Сохраняем твои старые переменные на случай, если они используются в коде
      - key: POSTGRES_DB
        value: keyed
      - key: POSTGRES_USER
        value: keyed_admin
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: keyed-db
          property: password
      - key: POSTGRES_PORT
        value: "5432"
      - key: JWT_SECRET
        value: KeyedVaultDevSecretChangeMeInProduction32Chars
      - key: JWT_EXPIRATION_MS
        value: "86400000"
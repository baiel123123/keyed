services:
  postgres:
    image: postgres:16-alpine
    container_name: keyed-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keyed}
      POSTGRES_USER: ${POSTGRES_USER:-keyed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keyed_secure}
    volumes:
      - keyed_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keyed} -d ${POSTGRES_DB:-keyed}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  keyed_pg_data:
  keyed_pgadmin_data:

spring.application.name=Assets (Emir_Comfci24)

# ?????? ????????? ???? ??? Tomcat ?????? ??????????
server.port=${PORT:8080}

# ???????????? ???????????: ????? SPRING_DATASOURCE_URL ?? Render, ???? ???????????? ?? localhost
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:keyed}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:keyed_secure}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ????????? JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ????????? ???????? ??????
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JWT ?????????
app.jwt.secret=${JWT_SECRET:KeyedVaultDevSecretChangeMeInProduction32Chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
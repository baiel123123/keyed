spring.application.name=Assets (Emir_Comfci24)

# PostgreSQL в Docker (docker compose up -d)
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:keyed}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:keyed_secure}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JWT (override JWT_SECRET in production — min 32 characters for HS256)
app.jwt.secret=${JWT_SECRET:KeyedVaultDevSecretChangeMeInProduction32Chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
